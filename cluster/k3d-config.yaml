---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: platform

servers: 1
agents: 2

image: rancher/k3s:v1.31.2-k3s1

# 8080 and 8443 instead of 80 and 443: privileged ports need elevated
# permissions and would break startup without sudo.
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer

# Local registry the follow-up GitOps project needs to publish images
# without going out to the internet.
registries:
  create:
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5111"

options:
  k3s:
    extraArgs:
      # k3s ships Traefik by default. Left on, it fights ingress-nginx for
      # port 80 and the Ingress returns intermittent 404s.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # The k3d loadbalancer already publishes the host ports; servicelb
      # would add a second port allocator competing for the same thing.
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
      # k3s ships its own metrics-server and owns the ClusterRole
      # system:metrics-server. Left on, the Helm chart aborts with
      # "invalid ownership metadata" instead of installing.
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
