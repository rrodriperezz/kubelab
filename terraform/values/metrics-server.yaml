---
# In k3d the kubelet certificate is not valid for the name metrics-server uses
# to reach it. This is a local-only concession: in production the fix is to sign
# the kubelet certificates, never to turn the check off.
args:
  - --kubelet-insecure-tls

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 200Mi
