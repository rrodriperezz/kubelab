---
controller:
  # The k3d loadbalancer already publishes the host ports; a LoadBalancer
  # Service here would stay pending forever.
  service:
    type: ClusterIP

  # The k3d loadbalancer spreads connections across every node, so the
  # controller has to listen on each node's port.
  kind: DaemonSet

  # Without hostPort there is no way to reach the controller from the host,
  # because the Service is ClusterIP.
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  metrics:
    enabled: true

  # Requests and limits are declared so the scheduler has something to decide
  # on and checkov does not flag the container as unbounded.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  config:
    # Behind the k3d proxy the client IP arrives in X-Forwarded-For; without this
    # logs and allowlist annotations always see the loadbalancer's IP.
    use-forwarded-headers: "true"

  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
