---
# CRDs are installed with the chart, not separately: installed apart, a helm
# uninstall leaves them orphaned and the next apply fails.
crds:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# There is no metrics stack yet; enabling this creates a ServiceMonitor whose
# CRD does not exist and the release fails.
prometheus:
  enabled: false
