---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.9.8
  K3D_VERSION: v5.7.4

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper replaces terraform's output with an annotated version and
          # breaks any step that reads stdout.
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: shellcheck
        run: shellcheck tests/smoke.sh

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yml cluster/ terraform/values/ .github/

  cluster:
    name: cluster
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: install k3d
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=${{ env.K3D_VERSION }} bash
          k3d version

      - name: create cluster and platform
        run: make up

      - name: smoke test
        run: make test

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A || true
          kubectl get certificate,clusterissuer -A || true
          kubectl describe hpa demo -n demo || true

      - name: tear down
        if: always()
        run: make down

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks walks the full history; with the default shallow checkout it
          # would only see the last commit.
          fetch-depth: 0

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: false

      - name: trivy config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Local tool directories, not part of the repository.
          skip-dirs: .venv,.tools

      # The plain binary instead of gitleaks-action: the action writes its SARIF
      # report to the workspace and fails with "permission denied" on the runner.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sfL -o /tmp/gitleaks.tar.gz "$base/v${GITLEAKS_VERSION}/$archive"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact
